<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGW VidAds — Video Ad Creator</title>

     SETUP: Replace the two lines below with your Supabase project values.
     Find them in: Supabase Dashboard > Project Settings > API
     ============================================================ -->
<script>
  const SUPABASE_URL  = 'https://hksoqmnoojyoxszzqobk.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhrc29xbW5vb2p5b3hzenpxb2JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4ODUzNjAsImV4cCI6MjA5NDQ2MTM2MH0.FlbrfH46fVv2nRdDQCRpBxT4JusE46lT3FegTRX8OpA';
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#07070f;color:#e0dff5;min-height:100vh}
:root{
  --bg0:#07070f;--bg1:#0f0f1e;--bg2:#161626;--bg3:#1e1e32;
  --gold:#e8a832;--gold2:#c4861a;--gold-dim:#3d2e0e;
  --purple:#7c5cbf;--purple-l:#a07edd;
  --text:#e0dff5;--text2:#9898bb;
  --border:#2a2a44;--border2:#3a3a58;
  --ok:#2cb87a;--err:#e05050;
}

/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--bg1);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.logo{font-size:19px;font-weight:700;color:#fff}.logo span{color:var(--gold)}
.nav-r{display:flex;align-items:center;gap:8px}
.nbtn{background:none;border:1px solid var(--border2);color:var(--text2);padding:6px 14px;border-radius:7px;cursor:pointer;font-size:13px;transition:all .15s}
.nbtn:hover{border-color:var(--gold);color:var(--gold)}
.nbtn.act{background:var(--gold);border-color:var(--gold);color:#07070f;font-weight:600}
.cbadge{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--gold-dim);border-radius:20px;padding:5px 14px;font-size:13px;color:var(--gold);font-weight:600}

/* PAGES */
.page{min-height:calc(100vh - 53px);padding:32px 24px}

/* AUTH */
.auth-wrap{max-width:420px;margin:60px auto}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:36px}
.auth-logo{text-align:center;font-size:24px;font-weight:800;color:#fff;margin-bottom:6px}.auth-logo span{color:var(--gold)}
.auth-sub{text-align:center;color:var(--text2);font-size:14px;margin-bottom:28px}
.auth-tabs{display:flex;background:var(--bg3);border-radius:8px;padding:3px;margin-bottom:24px}
.auth-tab{flex:1;padding:8px;border:none;background:none;color:var(--text2);cursor:pointer;border-radius:6px;font-size:14px;transition:all .15s}
.auth-tab.act{background:var(--bg2);color:#fff;font-weight:600}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
input{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 13px;border-radius:8px;font-size:14px;outline:none;width:100%;transition:border-color .15s}
input:focus{border-color:var(--gold)}
.sbtn{width:100%;padding:12px;background:var(--gold);color:#07070f;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;transition:all .15s}
.sbtn:hover{background:#f5be52}
.sbtn:disabled{background:var(--bg3);color:var(--text2);cursor:not-allowed}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
.msg.ok{background:rgba(44,184,122,.15);border:1px solid rgba(44,184,122,.3);color:var(--ok);display:block}
.msg.err{background:rgba(224,80,80,.15);border:1px solid rgba(224,80,80,.3);color:var(--err);display:block}
.free-note{text-align:center;font-size:12px;color:var(--text2);margin-top:16px}
.free-note strong{color:var(--gold)}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{padding-right:40px;width:100%}
.pw-eye{position:absolute;right:10px;background:none;border:none;cursor:pointer;color:var(--text2);font-size:18px;padding:0;line-height:1;transition:color .15s}
.pw-eye:hover{color:var(--gold)}

/* DASHBOARD */
.dash-max{max-width:1080px;margin:0 auto}
.dh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.dh h1{font-size:22px;font-weight:700;color:#fff}
.dh p{font-size:13px;color:var(--text2);margin-top:3px}
.cred-bar-wrap{background:var(--bg2);border:1px solid var(--gold-dim);border-radius:14px;padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.cred-num{font-size:38px;font-weight:800;color:var(--gold);letter-spacing:-1px;min-width:120px}
.cred-num small{font-size:13px;color:var(--text2);font-weight:400;display:block;margin-top:2px}
.bar-wrap{flex:1;min-width:180px}
.btrack{height:7px;background:var(--bg3);border-radius:4px;overflow:hidden;border:1px solid var(--border);margin-bottom:5px}
.bfill{height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:4px;transition:width .5s}
.blabels{display:flex;justify-content:space-between;font-size:11px;color:var(--text2)}
.plan-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 10px;border-radius:20px;background:var(--gold-dim);color:var(--gold)}

/* CREATE PANEL */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:24px}
.panel h2{font-size:17px;font-weight:600;color:#fff;margin-bottom:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.finput{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:7px;font-size:13px;outline:none;width:100%;transition:border-color .15s}
.finput:focus{border-color:var(--gold)}
.chip-row{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:12px;transition:all .15s;white-space:nowrap}
.chip.sel{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);font-weight:600}
.cost-row{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.genbtn{width:100%;padding:14px;background:var(--gold);color:#07070f;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.genbtn:hover{background:#f5be52}
.genbtn:disabled{background:var(--bg3);color:var(--text2);cursor:not-allowed}

/* GENERATING */
.gen-box{display:flex;flex-direction:column;align-items:center;padding:36px;text-align:center}
.spin{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{width:100%;max-width:280px;margin:10px auto 0}
.pt{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:3px;transition:width .4s}

/* VIDEOS */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.vcard{background:var(--bg2);border:1px solid var(--border);border-radius:11px;overflow:hidden;cursor:pointer;transition:all .2s}
.vcard:hover{border-color:var(--border2);transform:translateY(-2px)}
.vthumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative;background:var(--bg3)}
.vplay{position:absolute;width:36px;height:36px;background:rgba(0,0,0,.7);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}
.vmeta{padding:10px 12px}
.vtitle{font-size:13px;font-weight:600;color:#fff;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsub{font-size:11px;color:var(--text2);display:flex;justify-content:space-between}
.vcr{font-size:10px;color:var(--gold);background:var(--gold-dim);padding:2px 7px;border-radius:10px}
.empty{text-align:center;padding:48px;color:var(--text2);font-size:14px}

/* ADMIN */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:18px}
.sc-l{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.sc-v{font-size:26px;font-weight:700;color:#fff}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text)}
tr:last-child td{border:none}
tr:hover td{background:var(--bg3)}
.badge{display:inline-flex;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-free{background:#2a2a44;color:var(--text2)}
.b-starter{background:rgba(124,92,191,.2);color:var(--purple-l)}
.b-pro{background:var(--gold-dim);color:var(--gold)}
.abtn{background:none;border:1px solid var(--border);color:var(--text2);padding:3px 9px;border-radius:5px;cursor:pointer;font-size:11px;transition:all .15s}
.abtn:hover{border-color:var(--gold);color:var(--gold)}

/* MODAL */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:28px;min-width:320px;max-width:440px;width:90%}
.modal h3{font-size:17px;font-weight:600;color:#fff;margin-bottom:16px}
.mfooter{display:flex;gap:10px;margin-top:18px}
.mfooter button{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.mfooter .mok{background:var(--gold);color:#07070f}
.mfooter .mcancel{background:var(--bg3);border:1px solid var(--border);color:var(--text)}

/* LANDING */
.hero{text-align:center;padding:70px 24px 50px;max-width:820px;margin:0 auto}
.hero-badge{display:inline-flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--gold-dim);border-radius:20px;padding:5px 16px;font-size:11px;color:var(--gold);margin-bottom:24px;text-transform:uppercase;letter-spacing:1px}
.hero h1{font-size:clamp(32px,5vw,58px);font-weight:800;line-height:1.1;letter-spacing:-1.5px;margin-bottom:18px;color:#fff}
.hero h1 span{color:var(--gold)}
.hero p{font-size:17px;color:var(--text2);max-width:580px;margin:0 auto 30px;line-height:1.6}
.hctas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.blg{padding:13px 30px;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.blg-g{background:var(--gold);color:#07070f}.blg-g:hover{background:#f5be52}
.blg-o{background:none;border:1px solid var(--border2);color:var(--text)}.blg-o:hover{border-color:var(--gold);color:var(--gold)}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;max-width:1020px;margin:0 auto 60px}
.fcard{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px}
.fcard h3{font-size:15px;font-weight:600;color:#fff;margin:12px 0 6px}
.fcard p{font-size:13px;color:var(--text2);line-height:1.6}
.ficon{font-size:26px}

/* PRICING */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:860px;margin:0 auto}
.pcard{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:28px;position:relative}
.pcard.feat{border:2px solid var(--gold)}
.ptag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--gold);color:#07070f;font-size:10px;font-weight:700;padding:3px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.pname{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.pprice{font-size:38px;font-weight:800;color:#fff;letter-spacing:-1px}
.pprice span{font-size:14px;font-weight:400;color:var(--text2)}
.pcreds{font-size:12px;color:var(--gold);font-weight:600;padding:6px 11px;background:var(--gold-dim);border-radius:7px;display:inline-block;margin:10px 0 18px}
.pfeat{list-style:none;margin-bottom:22px}
.pfeat li{font-size:13px;color:var(--text2);padding:7px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px}
.pfeat li:last-child{border:none}
.ck{color:var(--ok)}
.pbtn{width:100%;padding:11px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.pbtn-g{background:var(--gold);color:#07070f}.pbtn-g:hover{background:#f5be52}
.pbtn-o{background:none;border:1px solid var(--border2);color:var(--text)}.pbtn-o:hover{border-color:var(--gold);color:var(--gold)}

.loading{display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:14px;color:var(--text2)}
</style>
</head>
<body>

<div id="app">
  <div class="loading">
    <div class="spin"></div>
    <span>Loading BGW VidAds...</span>
  </div>
</div>

<script>
// ── Init Supabase ──────────────────────────────────────────────
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON);

// ── App State ──────────────────────────────────────────────────
let state = {
  session: null,
  profile: null,
  page: 'home',      // home | pricing | dashboard | admin | auth
  authTab: 'login',
  videos: [],
  allUsers: [],
  generating: false,
  genProgress: 0,
  genMsg: '',
  modal: null,       // { type, user } or null
  style: 'Indigenous Sky',
  ratio: '16:9',
  audioVal: '',
  desc: '',
  addCredAmt: 100,
  authLoading: false,
  authMsg: null,
};

const STYLES = ['Cinematic','Urban','Nature','Abstract','Indigenous Sky','Retro Wave','Minimal'];
const RATIOS = [['16:9','Landscape'],['9:16','Reels'],['1:1','Square']];
const GEN_MSGS = ['Analyzing audio rhythm...','Building storyboard...','Generating scene visuals...','Syncing to beat...','Applying style filters...','Rendering final video...'];
const THUMBS   = ['🌄','🎬','🏙️','🌿','⚡','🎵','🌌','🔥'];
const PLAN_MAX = {free:50, starter:500, pro:1000};

// ── Render Engine ──────────────────────────────────────────────
function render() {
  document.getElementById('app').innerHTML = buildApp();
  bindEvents();
}

function buildApp() {
  if (!state.session) {
    if (state.page === 'home')    return buildNav() + buildLanding();
    if (state.page === 'pricing') return buildNav() + buildPricing();
    return buildNav() + buildAuth();
  }
  if (state.page === 'admin' && state.profile?.is_admin) return buildNav() + buildAdmin();
  if (state.page === 'pricing') return buildNav() + buildPricing();
  return buildNav() + buildDashboard();
}

// ── NAV ────────────────────────────────────────────────────────
function buildNav() {
  const p = state.profile;
  if (!state.session) {
    return `<nav class="nav">
      <div class="logo">BGW <span>VidAds</span></div>
      <div class="nav-r">
        <button class="nbtn${state.page==='home'?' act':''}" onclick="nav('home')">Home</button>
        <button class="nbtn${state.page==='pricing'?' act':''}" onclick="nav('pricing')">Pricing</button>
        <button class="nbtn act" onclick="nav('auth')">Sign In / Sign Up</button>
      </div>
    </nav>`;
  }
  return `<nav class="nav">
    <div class="logo">BGW <span>VidAds</span></div>
    <div class="nav-r">
      <button class="nbtn${state.page==='dashboard'?' act':''}" onclick="nav('dashboard')">My Videos</button>
      <button class="nbtn${state.page==='pricing'?' act':''}" onclick="nav('pricing')">Plans</button>
      ${(p?.is_admin === true || p?.is_admin === 'true') ? `<button class="nbtn${state.page==='admin'?' act':''}" style="border-color:var(--purple-l);color:${state.page==='admin'?'#07070f':'var(--purple-l)'};background:${state.page==='admin'?'var(--purple-l)':'none'}" onclick="nav('admin')">Admin</button>` : ''}
      <div class="cbadge">✦ ${p?.credits ?? 0}</div>
      <button class="nbtn" onclick="signOut()">Sign Out</button>
    </div>
  </nav>`;
}

// ── AUTH ───────────────────────────────────────────────────────
function buildAuth() {
  const isLogin = state.authTab === 'login';
  return `<div class="page">
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo">BGW <span>VidAds</span></div>
        <div class="auth-sub">${isLogin ? 'Welcome back — sign in to your account' : 'Create your free account — 50 credits included'}</div>
        <div class="auth-tabs">
          <button class="auth-tab${isLogin?' act':''}" onclick="setAuthTab('login')">Sign In</button>
          <button class="auth-tab${!isLogin?' act':''}" onclick="setAuthTab('signup')">Create Account</button>
        </div>
        ${state.authMsg ? `<div class="msg ${state.authMsg.type}">${state.authMsg.text}</div>` : ''}
        ${!isLogin ? `<div class="fg"><label>Your Name</label><input id="auth-name" type="text" placeholder="Bill Williams"></div>` : ''}
        <div class="fg"><label>Email</label><input id="auth-email" type="email" placeholder="you@example.com"></div>
        <div class="fg"><label>Password</label>
          <div class="pw-wrap">
            <input id="auth-pass" type="password" placeholder="••••••••">
            <button class="pw-eye" type="button" onclick="togglePw()" id="pw-eye-btn" title="Show/hide password">👁</button>
          </div>
        </div>
        <button class="sbtn" onclick="authSubmit()" ${state.authLoading?'disabled':''}>
          ${state.authLoading ? 'Please wait...' : (isLogin ? 'Sign In →' : 'Create Free Account →')}
        </button>
        ${!isLogin ? `<p class="free-note">Free plan includes <strong>50 credits/month</strong>. No credit card needed.</p>` : ''}
      </div>
    </div>
  </div>`;
}

// ── DASHBOARD ─────────────────────────────────────────────────
function buildDashboard() {
  const p = state.profile;
  const max = PLAN_MAX[p?.plan ?? 'free'];
  const pct = Math.round(Math.min(100, ((p?.credits ?? 0) / max) * 100));
  return `<div class="page">
    <div class="dash-max">
      <div class="dh">
        <div><h1>Creator Dashboard</h1><p>Generate professional video ads powered by AI</p></div>
        <button class="blg blg-g" onclick="document.getElementById('create').scrollIntoView({behavior:'smooth'})">+ New Video Ad</button>
      </div>

      <div class="cred-bar-wrap">
        <div class="cred-num">${p?.credits ?? 0}<small>credits remaining</small></div>
        <div class="bar-wrap">
          <div class="btrack"><div class="bfill" style="width:${pct}%"></div></div>
          <div class="blabels"><span>0</span><span>Resets monthly</span><span>${max}</span></div>
        </div>
        <span class="plan-tag">${(p?.plan ?? 'free').toUpperCase()} PLAN</span>
      </div>

      <div id="create" class="panel">
        <h2>🎬 Create New Video Ad</h2>
        ${state.generating ? buildGenerating() : buildCreateForm()}
      </div>

      <div class="panel">
        <h2 style="margin-bottom:16px">My Video Ads (${state.videos.length})</h2>
        ${state.videos.length === 0
          ? `<div class="empty">No videos yet — create your first video ad above ↑</div>`
          : `<div class="vgrid">${state.videos.map(buildVideoCard).join('')}</div>`
        }
      </div>
    </div>
  </div>`;
}

function buildCreateForm() {
  const cost = state.ratio === '9:16' ? 38 : state.ratio === '1:1' ? 30 : 42;
  return `
    <div class="fgrid">
      <div class="fg full">
        <label>Audio File URL or Suno / CD Baby Link</label>
        <input class="finput" id="audioVal" placeholder="https://... or paste Suno link" value="${escHtml(state.audioVal)}">
      </div>
      <div class="fg full">
        <label>Video Description (optional)</label>
        <input class="finput" id="descVal" placeholder="e.g. Indigenous elder walking through forest at dawn...">
      </div>
      <div class="fg full">
        <label>Visual Style</label>
        <div class="chip-row">${STYLES.map(s=>`<button class="chip${state.style===s?' sel':''}" onclick="setState('style','${s}')">${s}</button>`).join('')}</div>
      </div>
      <div class="fg full">
        <label>Aspect Ratio</label>
        <div class="chip-row">${RATIOS.map(([r,l])=>`<button class="chip${state.ratio===r?' sel':''}" onclick="setState('ratio','${r}')">${r} <span style="font-size:10px;opacity:.7">${l}</span></button>`).join('')}</div>
      </div>
    </div>
    <div class="cost-row">
      <span style="color:var(--text2)">Estimated cost: <strong style="color:var(--gold)">~${cost} credits</strong> for 30 sec</span>
      <span style="color:var(--text2)">You have: <strong style="color:#fff">${state.profile?.credits ?? 0}</strong></span>
    </div>

  `;
}

        ${[['Total Users',users.length],['Paid Subscribers',users.filter(u=>u.plan!=='free').length],['Monthly Revenue','$'+revenue.toFixed(2)],['Total Credits',users.reduce((a,u)=>a+u.credits,0).toLocaleString()]].map(([l,v])=>`
          <div class="sc"><div class="sc-l">${l}</div><div class="sc-v">${v}</div></div>`).join('')}
      </div>
      <div class="panel">
        <h2 style="margin-bottom:16px">User Management</h2>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>User</th><th>Plan</th><th>Credits</th><th>Joined</th><th>Actions</th></tr></thead>
            <tbody>${users.map(u=>`
              <tr>
                <td><div style="font-weight:600;color:#fff">${escHtml(u.name||'—')}</div><div style="font-size:11px;color:var(--text2)">${escHtml(u.email||'')}</div></td>
                <td><span class="badge b-${u.plan}">${u.plan}</span></td>
                <td><span style="color:${u.credits<20?'var(--err)':'var(--text)'};font-weight:600">${u.credits}</span></td>
                <td style="color:var(--text2);font-size:12px">${formatDate(u.created_at)}</td>
                <td><div style="display:flex;gap:6px">
                  <button class="abtn" onclick="openModal({type:'credits',user:${JSON.stringify(u).replace(/"/g,'&quot;')}})">+ Credits</button>
                  <button class="abtn" onclick="openModal({type:'plan',user:${JSON.stringify(u).replace(/"/g,'&quot;')}})">Change Plan</button>
                </div></td>
              </tr>`).join('')}
            </tbody>
          </table>

      ${state.modal ? buildModal() : ''}

}

function buildModal() {
  const m = state.modal;
  if (m.type === 'credits') return `
    <div class="moverlay" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>Add Credits — ${escHtml(m.user.name||m.user.email)}</h3>
        <div class="fg"><label>Amount</label>
          <div class="chip-row" style="margin-bottom:10px">
            ${[50,100,250,500,1000].map(n=>`<button class="chip${state.addCredAmt===n?' sel':''}" onclick="setState('addCredAmt',${n})">${n}</button>`).join('')}
          </div>
          <input class="finput" id="credAmt" type="number" value="${state.addCredAmt}" min="1" max="9999">
        </div>
        <div class="mfooter">
          <button class="mcancel" onclick="closeModal()">Cancel</button>
          <button class="mok" onclick="doAddCredits()">Add Credits</button>
        </div>
      </div>
    </div>`;
  if (m.type === 'plan') return `
    <div class="moverlay" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>Change Plan — ${escHtml(m.user.name||m.user.email)}</h3>
        <div class="chip-row" style="margin-bottom:16px">
          ${['free','starter','pro'].map(pl=>`<button class="chip${m.user.plan===pl?' sel':''}" onclick="state.modal.user.plan='${pl}';render()">${pl}</button>`).join('')}
        </div>
        <div class="mfooter">
          <button class="mcancel" onclick="closeModal()">Cancel</button>
          <button class="mok" onclick="doChangePlan()">Save Plan</button>
        </div>
      </div>
    </div>`;
  return '';
}

    {id:'starter', name:'Starter', price:19.99, credits:500, feats:['500 credits/month','1080p resolution','No watermark','All 7 styles','Email support','Commercial licence','Credits roll over'], pop:false},
    {id:'pro', name:'Pro', price:39.99, credits:1000, feats:['1000 credits/month','4K resolution','No watermark','All styles + Indigenous Collection','Priority queue','Commercial licence','Credits roll over','Add-on credit packs'], pop:true},
  ];

    <div style="max-width:900px;margin:0 auto">

// ── ACTIONS ───────────────────────────────────────────────────
async function nav(p) {
  state.page = p;
  state.authMsg = null;
  if (p === 'admin' && state.session) {
    await loadAllUsers();
  }
  render();
}

function setAuthTab(t) { state.authTab = t; state.authMsg = null; render(); }

function setState(k, v) { state[k] = v; render(); }

async function authSubmit() {
  const email = document.getElementById('auth-email')?.value?.trim();
  const pass  = document.getElementById('auth-pass')?.value;
  const name  = document.getElementById('auth-name')?.value?.trim();
  if (!email || !pass) { state.authMsg = {type:'err',text:'Please fill in all fields.'}; render(); return; }
  state.authLoading = true; state.authMsg = null; render();
  try {
    if (state.authTab === 'signup') {
      const {error} = await db.auth.signUp({email, password:pass, options:{data:{name}}});
      if (error) throw error;
      state.authMsg = {type:'ok', text:'Account created! Check your email to confirm, then sign in.'};
      state.authTab = 'login';
    } else {
      const {data, error} = await db.auth.signInWithPassword({email, password:pass});
      if (error) throw error;
      state.session = data.session;
      await loadProfile();
      await loadVideos();
      state.page = 'dashboard';
    }
  } catch(e) {
    state.authMsg = {type:'err', text: e.message || 'Something went wrong. Try again.'};
  }
  state.authLoading = false;
  render();
}

async function signOut() {
  await db.auth.signOut();
  state.session = null; state.profile = null; state.videos = [];
  state.page = 'home'; render();
}

async function loadProfile() {
  const uid = state.session?.user?.id;
  if (!uid) return;
  const {data} = await db.from('profiles').select('*').eq('id', uid).single();
  state.profile = data;
}

async function loadVideos() {
  const uid = state.session?.user?.id;
  if (!uid) return;
  const {data} = await db.from('video_projects').select('*').eq('user_id', uid).order('created_at', {ascending:false});
  state.videos = data || [];
}

async function loadAllUsers() {
  const {data, error} = await db.from('profiles').select('*').order('created_at', {ascending:false});
  if (error) console.error('loadAllUsers error:', error);
  state.allUsers = data || [];
}

async function startGenerate() {
  state.audioVal = document.getElementById('audioVal')?.value?.trim() || '';
  state.desc     = document.getElementById('descVal')?.value?.trim()  || '';
  if (!state.audioVal) { alert('Please enter an audio URL or file link.'); return; }
  if ((state.profile?.credits || 0) < 20) { alert('Not enough credits.'); return; }
  const cost = state.ratio === '9:16' ? 38 : state.ratio === '1:1' ? 30 : 42;
  state.generating = true; state.genProgress = 0; state.genMsg = GEN_MSGS[0]; render();
  let step = 0;
  const iv = setInterval(async () => {
    step++;
    state.genProgress = Math.min(step * 16, 95);
    state.genMsg = GEN_MSGS[Math.min(step - 1, GEN_MSGS.length - 1)];
    render();
    if (step >= 6) {
      clearInterval(iv);
      // Save to Supabase
      const uid = state.session?.user?.id;
      const title = state.desc || 'Video Ad ' + new Date().toLocaleDateString();
      await db.from('video_projects').insert({user_id:uid, title, style:state.style, ratio:state.ratio, credits_used:cost, audio_url:state.audioVal, description:state.desc, status:'complete'});
      await db.from('credit_transactions').insert({user_id:uid, amount:-cost, reason:'Video generation'});
      await db.from('profiles').update({credits: Math.max(0, (state.profile.credits || 0) - cost)}).eq('id', uid);
      await loadProfile();
      await loadVideos();
      state.generating = false; state.genProgress = 100;
      state.audioVal = ''; state.desc = '';
      render();
    }
  }, 900);
}

function openModal(m) { state.modal = m; render(); }
function closeModal() { state.modal = null; render(); }

async function doAddCredits() {
  const amt = parseInt(document.getElementById('credAmt')?.value || state.addCredAmt, 10);
  if (!amt || amt < 1) return;
  const uid = state.modal.user.id;
  const newCredits = state.modal.user.credits + amt;
  await db.from('profiles').update({credits: newCredits}).eq('id', uid);
  await db.from('credit_transactions').insert({user_id:uid, amount:amt, reason:'Admin credit grant'});
  await loadAllUsers();
  closeModal();
}

async function doChangePlan() {
  const uid = state.modal.user.id;
  const plan = state.modal.user.plan;
  const credits = PLAN_MAX[plan];
  await db.from('profiles').update({plan, credits}).eq('id', uid);
  await loadAllUsers();
  closeModal();
}

// ── HELPERS ───────────────────────────────────────────────────
function togglePw() {
  const input = document.getElementById('auth-pass');
  const btn   = document.getElementById('pw-eye-btn');
  if (!input) return;
  if (input.type === 'password') { input.type = 'text';     btn.textContent = '🙈'; }
  else                           { input.type = 'password'; btn.textContent = '👁';  }
}

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatDate(d) { if (!d) return '—'; try { return new Date(d).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}); } catch { return '—'; } }

function bindEvents() {
  document.querySelectorAll('input').forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter' && document.getElementById('auth-email')) authSubmit(); });
  });
}

// ── BOOT ──────────────────────────────────────────────────────
(async () => {
  const {data: {session}} = await db.auth.getSession();
  if (session) {
    state.session = session;
    await loadProfile();
    await loadVideos();
    state.page = 'dashboard';
  }
  render();

  db.auth.onAuthStateChange(async (event, session) => {
    state.session = session;
    if (session) {
      await loadProfile();
      await loadVideos();
      if (state.page === 'home' || state.page === 'auth') state.page = 'dashboard';
    } else {
      state.profile = null; state.videos = [];
    }
    render();
  });
})();
</script>
